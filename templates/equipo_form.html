{% extends "base.html" %}
{% block title %}Registrar Equipo{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    
    <!-- Botón de retorno rápido -->
    <div class="mb-3">
      <a href="{{ url_for('listar_equipos') }}" class="text-decoration-none text-muted small fw-medium">
        <i class="bi bi-arrow-left me-1"></i> Volver al inventario de equipos
      </a>
    </div>

    <!-- Tarjeta Principal del Formulario -->
    <div class="card border-0 shadow-sm rounded-3">
      <!-- Encabezado de la Tarjeta -->
      <div class="card-header bg-white border-bottom p-4">
        <div class="d-flex align-items-center gap-3">
          <div class="p-3 rounded-3 text-white" style="background-color: #0d9488;">
            <i class="bi bi-cpu fs-4"></i>
          </div>
          <div>
            <h5 class="fw-bold mb-1" style="color: #0f172a;">Registrar Nuevo Equipo Médico</h5>
            <p class="text-muted small mb-0">Ingrese las especificaciones técnicas del dispositivo para el inventario.</p>
          </div>
        </div>
      </div>

      <!-- Cuerpo del Formulario -->
      <div class="card-body p-4">
        <form method="POST">
          
          <!-- Nombre del equipo -->
          <div class="mb-3">
            <label class="form-label fw-semibold text-dark small">Nombre del Equipo <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted">
                <i class="bi bi-tag"></i>
              </span>
              <input type="text" class="form-control bg-light border-start-0" name="nombre" placeholder="Ej. Monitor de Signos Vitales, Ultrasonido..." required>
            </div>
          </div>

          <!-- Filas dobles: Modelo y Número de Serie -->
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold text-dark small">Modelo</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted">
                  <i class="bi bi-box-seam"></i>
                </span>
                <input type="text" class="form-control bg-light border-start-0" name="modelo" placeholder="Ej. Mindray T5, Voluson E10">
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold text-dark small">N.° de Serie <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted">
                  <i class="bi bi-barcode"></i>
                </span>
                <input type="text" class="form-control bg-light border-start-0 font-monospace" name="numero_serie" placeholder="Ej. SN-2026-99" required>
              </div>
            </div>
          </div>

          <!-- Selección de Cliente -->
          <div class="mb-4">
            <label class="form-label fw-semibold text-dark small">Cliente / Institución Asignada <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted">
                <i class="bi bi-building"></i>
              </span>
              <select class="form-select bg-light border-start-0" name="cliente_id" required>
                <option value="" disabled selected>Seleccione un cliente u hospital...</option>
                {% for c in clientes %}
                <option value="{{ c.id }}">{{ c.nombre }} ({{ c.tipo }})</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <hr class="my-4 text-muted opacity-25">

          <!-- Botones de Acción -->
          <div class="d-flex align-items-center justify-content-end gap-2">
            <a href="{{ url_for('listar_equipos') }}" class="btn btn-light border px-4 fw-medium">
              Cancelar
            </a>
            <button type="submit" class="btn btn-primary px-4 fw-medium d-inline-flex align-items-center gap-2" style="background-color: #0f172a; border-color: #0f172a;">
              <i class="bi bi-check-circle"></i>
              <span>Guardar Equipo</span>
            </button>
          </div>

        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
